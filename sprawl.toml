# --- CONFIGURATION GÉNÉRALE ---
# --- A copier directement dans l'interface Foundry du module Pbta
rollFormula = "2d6"
statToggle = true

[rollResults]
  [rollResults.failure]
    range = "6-"
    label = "Échec (Réaction du MC)"
  [rollResults.partial]
    range = "7-9"
    label = "Succès partiel / Glitch"
  [rollResults.success]
    range = "10+"
    label = "Succès !"

# ==========================================
#              PERSONNAGES (PJ)
# ==========================================
[character]

  # 1. STATISTIQUES (The Sprawl Stats)
  [character.stats]
    cool = "Cran"
    edge = "Pro"
    meat = "Chair"
    mind = "Esprit"
    style = "Style"
    synth = "Synth"

  # 2. BARRES DU HAUT (Top Attributes)
  [character.attributesTop]
    [character.attributesTop.harm]
      label = "Blessures"
      type = "Clock"
      max = 6
    [character.attributesTop.xp]
      label = "Expérience"
      type = "Xp"
      max = 10
    [character.attributesTop.cred]
      label = "Crédit"
      type = "Resource"
      max = 50
    [character.attributesTop.intel]
      label = "Rens."
      type = "Resource"
      max = 3

  # 3. COLONNE DE GAUCHE (Left Attributes)
  [character.attributesLeft]
    [character.attributesLeft.look]
      label = "Look / Style"
      type = "LongText"
    [character.attributesLeft.directives]
      label = "Directives"
      type = "LongText"
    [character.attributesLeft.retenue]
      label = "[Retenue]"
      type = "Resource"
      max = 3
    [character.attributesLeft.info]
      label = "[Info]"
      type = "Resource"
      max = 5
    [character.attributesLeft.matos]
      label = "[Matos]"
      type = "Resource"
      max = 5

  # 4. GROUPES DE MANŒUVRES (Moves)
  [character.moveTypes]
    basic = "Manoeuvres de base"
    playbook = "Spécifiques"
    matrix = "Matrice"
    mission = "Mission"
    reputation = "Réputation"

  # 5. TYPES D'ÉQUIPEMENT (OBLIGATOIRE POUR ÉVITER L'ERREUR)
  [character.equipmentTypes]
    weapon = "Armes"
    armor = "Protection"
    gear = "Matériel"
    cyberware = "Cyberware"
    program = "Programmes"
    vehicle = "Véhicules"
    bond = "Liens"

# ==========================================
#              PNJ (NPC)
# ==========================================
# Cette section est OBLIGATOIRE sinon erreur "npc type requis"
[npc]
  
  [npc.attributesTop]
    [npc.attributesTop.harm]
      label = "Santé / Menace"
      type = "Clock"
      max = 10
    [npc.attributesTop.instinct]
      label = "Instinct"
      type = "Text"

  [npc.attributesLeft]
    [npc.attributesLeft.description]
      label = "Description"
      type = "LongText"

  [npc.moveTypes]
    gm = "Manoeuvres MC"

  [npc.equipmentTypes]
    weapon = "Armes"
    gear = "Matériel"
